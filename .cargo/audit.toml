# cargo audit config
# This file makes `cargo audit --deny warnings` pass without CLI --ignore flags.
# See https://github.com/RustSec/cargo-audit/blob/main/audit.toml.example
#
# The ignored advisories are transitive Soroban test-host dependencies and are
# NOT used in the deployed WASM. Vulnerability advisories remain enabled.

[advisories]
ignore = ["RUSTSEC-2024-0388", "RUSTSEC-2024-0436"]
# RUSTSEC-2024-0388: `derivative` 2.2.0 unmaintained (via ark-* -> soroban-env-host)
# RUSTSEC-2024-0436: `paste` 1.0.15 unmaintained (via ark-ff/wasmi_core -> soroban-env-host)

[yanked]
enabled = false
# spin 0.9.8 is yanked but required by soroban-wasmi 0.31.1-soroban.20.0.1 -> soroban-env-host.
# We disable yanked warnings here for the same reason; explicit vulnerability checks remain.
# Equivalent to CLI `--no-yanked`.
