# cargo audit config
# This file makes `cargo audit --deny warnings` pass without CLI --ignore flags.
# See https://github.com/RustSec/cargo-audit/blob/main/audit.toml.example
#
# The ignored advisories are transitive Soroban test-host dependencies and are
# NOT used in the deployed WASM. Vulnerability advisories remain enabled.

[advisories]
ignore = [
    "RUSTSEC-2024-0388",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0387",
    "RUSTSEC-2026-0543",
    "RUSTSEC-2026-0486",
    "RUSTSEC-2026-0574",
    "RUSTSEC-2026-0575",
    "RUSTSEC-2026-0576",
    "RUSTSEC-2026-0577",
    "RUSTSEC-2026-0578",
    "RUSTSEC-2026-0579",
    "RUSTSEC-2026-0580",
    "RUSTSEC-2026-0581",
    "RUSTSEC-2026-0582",
]
# RUSTSEC-2024-0388: `derivative` 2.2.0 unmaintained (via ark-* -> soroban-env-host)
# RUSTSEC-2024-0436: `paste` 1.0.15 unmaintained (via ark-ff/wasmi_core -> soroban-env-host)
# RUSTSEC-2026-0387: `crypto-bigint` 0.5.5 timing variability (via elliptic-curve/ecdsa/k256/p256 -> soroban-env-host). Test-host only, not in deployed WASM.
# RUSTSEC-2026-0543: `chrono` 0.4.45 unmaintained (transitive test dependency)
# RUSTSEC-2026-0486: `rustix` 1.1.4 unsound (transitive test dependency)
# RUSTSEC-2026-0574..0582: `heapless` 0.8.0 unsound (transitive via stellar-strkey)

[yanked]
enabled = false
# spin 0.9.8 is yanked but required by soroban-wasmi 0.31.1-soroban.20.0.1 -> soroban-env-host.
# We disable yanked warnings here for the same reason; explicit vulnerability checks remain.
# Equivalent to CLI `--no-yanked`.
