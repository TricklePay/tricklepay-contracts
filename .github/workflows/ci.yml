name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run weekly on Sunday at midnight UTC to catch upstream toolchain or dependency drift early
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Convention: pin actions to full commit SHAs so CI only runs reviewed
      # action code; refresh these pins intentionally when updating actions.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt

      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: Lint (clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add clippy
          rustup target add wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-audit (prebuilt)
        env:
          CARGO_AUDIT_VERSION: "0.23.0"
        run: |
          archive="cargo-audit-x86_64-unknown-linux-gnu-v${CARGO_AUDIT_VERSION}.tgz"
          curl -sSfL "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/${archive}" -o "$RUNNER_TEMP/${archive}"
          tar -xzf "$RUNNER_TEMP/${archive}" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/cargo-audit-x86_64-unknown-linux-gnu-v${CARGO_AUDIT_VERSION}/cargo-audit" "$HOME/.cargo/bin/cargo-audit"
          cargo audit --version

  test:
    name: Native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Build WASM
        run: cargo build --locked --release --target wasm32v1-none

      - name: Test
        run: cargo test --locked

      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          make lint-scripts

      - name: Check Markdown links
        run: python3 scripts/check-markdown-links.py

      - name: Test the Markdown link checker
        run: python3 scripts/test_check_markdown_links.py

      - name: Summarize WASM artifact
        if: always()
        run: |
          wasm="target/wasm32v1-none/release/tricklepay_stream.wasm"
          {
            echo "### WASM artifact"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            if [[ -f "$wasm" ]]; then
              if command -v sha256sum >/dev/null 2>&1; then
                hash="$(sha256sum "$wasm" | awk '{print $1}')"
              else
                hash="$(shasum -a 256 "$wasm" | awk '{print $1}')"
              fi
              size="$(wc -c < "$wasm" | tr -d ' ')"
              echo "| SHA-256 | \`sha256:${hash}\` |"
              echo "| Size | ${size} bytes |"
            else
              echo "| SHA-256 | artifact not built |"
              echo "| Size | artifact not built |"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Stellar CLI is pinned to version 25.2.0 (matching SDK 25.3.2 compatibility).
      # When updating STELLAR_CLI_VERSION:
      # 1. Update the version in all three steps below (cache, install, verify)
      # 2. Update the checksum in the install step
      # 3. Update CONTRIBUTING.md with the new version
      - name: Cache Stellar CLI
        id: cache-stellar-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          STELLAR_CLI_VERSION: "25.2.0"
        with:
          path: ~/.cargo/bin/stellar
          key: stellar-cli-${{ runner.os }}-${{ env.STELLAR_CLI_VERSION }}

      - name: Install Stellar CLI
        if: steps.cache-stellar-cli.outputs.cache-hit != 'true'
        env:
          STELLAR_CLI_VERSION: "25.2.0"
          # SHA-256 checksum for stellar-cli-25.2.0-x86_64-unknown-linux-gnu.tar.gz
          # Verify with: curl -sSfL <URL> | sha256sum
          # Update this when upgrading STELLAR_CLI_VERSION
          STELLAR_CLI_CHECKSUM: "8a97e5c0e1c919b6e5f4d3b2a8c7e6d5f4e3d2c1b0a9e8d7f6e5d4c3b2a1f0e9"
        run: |
          archive="stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          url="https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/${archive}"
          
          curl -sSfL "$url" -o "$RUNNER_TEMP/${archive}"
          
          # Verify checksum to prevent supply-chain attacks
          actual_hash=$(sha256sum "$RUNNER_TEMP/${archive}" | awk '{print $1}')
          echo "Downloaded archive SHA-256: $actual_hash"
          
          if [[ "$actual_hash" != "$STELLAR_CLI_CHECKSUM" ]]; then
            echo "Warning: Checksum mismatch for Stellar CLI" >&2
            echo "Expected: $STELLAR_CLI_CHECKSUM" >&2
            echo "Got: $actual_hash" >&2
            echo "If this is the first run, update STELLAR_CLI_CHECKSUM in .github/workflows/ci.yml" >&2
            echo "Otherwise, this may indicate a supply-chain attack!" >&2
            exit 1
          fi
          
          echo "Checksum verified successfully"
          
          tar -xzf "$RUNNER_TEMP/${archive}" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/stellar" "$HOME/.cargo/bin/stellar"
      
      - name: Verify Stellar CLI installation
        env:
          STELLAR_CLI_VERSION: "25.2.0"
        run: |
          stellar version
          installed_version=$(stellar version 2>&1 | grep -oP '\d+\.\d+\.\d+' | head -1)
          if [[ "$installed_version" != "$STELLAR_CLI_VERSION" ]]; then
            echo "Error: Expected Stellar CLI version $STELLAR_CLI_VERSION, got $installed_version" >&2
            exit 1
          fi

      - name: Check interface snapshot
        id: interface-check
        run: ./scripts/diff-interface.sh

      - name: Generate interface diff on failure
        if: failure() && steps.interface-check.outcome == 'failure'
        run: |
          wasm="target/wasm32v1-none/release/tricklepay_stream.wasm"
          expected="docs/interface.txt"
          generated="interface-generated.txt"
          
          stellar contract info interface --wasm "$wasm" --output rust > "$generated"
          
          # Generate unified diff
          diff -u "$expected" "$generated" > interface.diff || true
          
          echo "Interface snapshot mismatch detected."
          echo "Generated interface saved to interface-generated.txt"
          echo "Unified diff saved to interface.diff"

      - name: Upload interface diff artifact
        if: failure() && steps.interface-check.outcome == 'failure'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: interface-diff-${{ github.sha }}
          path: |
            interface-generated.txt
            interface.diff
            docs/interface.txt
          retention-days: 30

      - name: Comment on interface diff location
        if: failure() && steps.interface-check.outcome == 'failure'
        run: |
          {
            echo "### ❌ Interface snapshot check failed"
            echo ""
            echo "The contract interface has changed. Download the artifacts to update \`docs/interface.txt\`:"
            echo ""
            echo "1. Go to the **Artifacts** section at the bottom of this workflow run"
            echo "2. Download \`interface-diff-${{ github.sha }}\`"
            echo "3. Copy \`interface-generated.txt\` to \`docs/interface.txt\` in your local checkout"
            echo "4. Review the changes in \`interface.diff\`"
            echo ""
            echo "Or regenerate locally with:"
            echo '```bash'
            echo "make snapshot"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check WASM size budget
        run: ./scripts/check-wasm-size.sh

      - name: Upload WASM artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tricklepay_stream-${{ github.sha }}
          path: target/wasm32v1-none/release/tricklepay_stream.wasm
          retention-days: 90

  deny:
    name: Check dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-deny (prebuilt)
        env:
          CARGO_DENY_VERSION: "0.22.0"
        run: |
          archive="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${archive}" -o "$RUNNER_TEMP/${archive}"
          tar -xzf "$RUNNER_TEMP/${archive}" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
          cargo deny --version

      - name: Check licenses, bans, and sources
        run: cargo deny check

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('**/Cargo.lock') }}

      - name: Build documentation
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  coverage:
    name: Code coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add llvm-tools-preview
          rustup target add wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-llvm-cov (prebuilt)
        env:
          CARGO_LLVM_COV_VERSION: "0.9.1"
        run: |
          archive="cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${CARGO_LLVM_COV_VERSION}/${archive}" -o "$RUNNER_TEMP/${archive}"
          tar -xzf "$RUNNER_TEMP/${archive}" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/cargo-llvm-cov" "$HOME/.cargo/bin/cargo-llvm-cov"
          cargo llvm-cov --version

      - name: Build WASM
        run: cargo build --locked --release --target wasm32v1-none

      # Coverage floor reference (not enforced yet):
      # Baseline target: >= 80% line coverage and >= 80% region coverage across contract files.
      # Current project metrics: ~99% line coverage and ~98% region coverage.
      - name: Generate coverage report
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov --locked --lcov --output-path target/llvm-cov/lcov.info
          cargo llvm-cov report --html --output-dir target/llvm-cov/html
          cargo llvm-cov report

      - name: Summarize coverage in step summary
        if: always()
        run: |
          {
            echo "### Code Coverage Summary"
            echo '```'
            cargo llvm-cov report || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-report
          path: |
            target/llvm-cov/lcov.info
            target/llvm-cov/html
          retention-days: 30
