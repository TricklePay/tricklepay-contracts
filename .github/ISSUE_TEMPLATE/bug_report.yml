name: Bug report
description: Report a problem with the TricklePay contracts
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Before you start, please confirm this is not a security vulnerability — if it could put funds at risk, follow the [responsible disclosure policy](https://github.com/Glittersup/tricklepay-docs/security/policy) instead of opening a public issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can a maintainer reproduce the bug? Include contract calls, arguments, and the ledger timestamps used.
      placeholder: |
        1. Call create_stream(...) with these arguments ...
        2. ...
        3. See error ...
    validations:
      required: true
  - type: dropdown
    id: contract
    attributes:
      label: Contract
      description: Which contract does this bug affect?
      options:
        - stream
        - Other (please specify below)
      default: 0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Rust toolchain, Soroban SDK version, and network (mainnet/testnet/standalone) you observed the bug on.
      placeholder: "e.g. rust 1.84.0, soroban-sdk 22.x, testnet"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and stack traces
      description: Include any relevant error messages, panics, or stack traces.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help, such as related issues or recent changes.
    validations:
      required: false
